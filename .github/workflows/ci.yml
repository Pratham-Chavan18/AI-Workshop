name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@f19d6e5d2bef8a8ceca2b7d77ec447fc304f8078
        with:
          path: ./
          # Catch verified AND unknown results
          extra_args: --results=verified,unknown

  quality-and-tests:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aiworkshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aiworkshop_test?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters_long
      VITE_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      # If npm workspaces are set up correctly at root, npm ci works.
      # Otherwise, install per-workspace. Verify before relying on this.
      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency Audit (full, non-blocking)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Prisma Validate & Generate
        run: |
          cd backend
          npx prisma validate
          npx prisma generate

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Supabase Roles (test database)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d aiworkshop_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN BYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
                CREATE ROLE authenticator NOINHERIT LOGIN;
              END IF;
            END
            $$;
          SQL

      - name: Apply Migrations
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Seed Test Database
        run: |
          cd backend
          npx prisma db seed
        # Remove this step if tests own their fixtures.

      - name: Frontend Lint
        run: npm run lint --workspace=frontend

      - name: Frontend Build
        env:
          NODE_ENV: production
          VITE_API_URL: http://localhost:4000/api/v1
        run: npm run build --workspace=frontend

      - name: Frontend Tests
        run: npm run test --workspace=frontend
        # Requires a `test` script in frontend/package.json.

      - name: Backend Lint
        run: npm run lint --workspace=backend

      - name: Backend Build
        env:
          NODE_ENV: production
        run: npm run build --workspace=backend

      - name: Backend Tests (real DB)
        run: npm run test --workspace=backend

      - name: Upload Coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
