name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@f19d6e5d2bef8a8ceca2b7d77ec447fc304f8078 # v3.88.5
        with:
          path: ./
          extra_args: --only-verified

  quality-and-tests:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aiworkshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Prisma Schema Validation
        run: |
          cd backend
          npx prisma validate

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Verify & Apply Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aiworkshop_test?schema=public
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Frontend Quality Gates (Typecheck, Lint & Build)
        run: |
          npm run lint --workspace=frontend
          npm run build --workspace=frontend

      - name: Backend Quality Gates (Typecheck, Lint & Build)
        run: |
          npm run lint --workspace=backend
          npm run build --workspace=backend

      - name: Run Backend Tests (Unit & Concurrency Integration)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aiworkshop_test?schema=public
          SESSION_SECRET: test_session_secret_for_ci_at_least_32_characters_long_12345
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173
        run: |
          npm run test --workspace=backend
