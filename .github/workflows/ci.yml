name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --results=verified,unknown

  build-and-test:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aiworkshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aiworkshop_test?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters_long
      VITE_API_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit (Production)
        run: npm audit --omit=dev --audit-level=high

      - name: Prisma Validate & Generate
        run: |
          cd backend
          npx prisma validate
          npx prisma generate

      - name: Setup Supabase Roles
        run: |
          cd backend
          npx prisma db execute --file ./prisma/create_roles.sql --url "$DATABASE_URL"

      - name: Apply Database Migrations
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Seed Test Database
        run: |
          cd backend
          npx prisma db seed

      - name: Frontend Lint
        run: npm run lint --workspace=frontend

      - name: Frontend Build
        env:
          NODE_ENV: production
          VITE_API_URL: http://localhost:4000/api/v1
        run: npm run build --workspace=frontend

      - name: Frontend Tests
        run: npm run test --workspace=frontend

      - name: Backend Lint
        run: npm run lint --workspace=backend

      - name: Backend Build
        env:
          NODE_ENV: production
        run: npm run build --workspace=backend

      - name: Backend Tests
        run: npm run test --workspace=backend
